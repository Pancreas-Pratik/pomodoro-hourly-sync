name: Anki Leaderboard — live updates and daily history

on:
  schedule:
    # Attempt collection every five minutes, including 03:50 and 03:55 ET.
    # GitHub Actions may start late or skip a run under load.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anki-leaderboard-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Public Anki data to Supabase (no GitHub/Discord posting)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show how this run was triggered
        env:
          ACTION_TRIGGER: ${{ github.event_name }}
        run: echo "GitHub Actions trigger = ${ACTION_TRIGGER} (schedule = automatic, workflow_dispatch = manual)"
      - name: Install requirements
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.2
      - name: Fetch opted-in users and save 5-minute current/daily statistics
        env:
          SUPABASE_URL: https://ssuqagroepoknexsweyr.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/anki_snapshot.py
