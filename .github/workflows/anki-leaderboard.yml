name: Anki Leaderboard — live updates and daily history

# Supabase Cron triggers this workflow through the GitHub Actions dispatch API.
# Keep workflow_dispatch for both Supabase and optional manual runs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anki-leaderboard-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Public Anki data to Supabase (no GitHub/Discord posting)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show how this run was triggered
        env:
          ACTION_TRIGGER: ${{ github.event_name }}
        run: echo "GitHub Actions trigger = ${ACTION_TRIGGER} (workflow_dispatch = Supabase Cron or manual run)"
      - name: Install requirements
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.2
      - name: Fetch opted-in users and save current/daily statistics
        env:
          SUPABASE_URL: https://ssuqagroepoknexsweyr.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/anki_snapshot.py
