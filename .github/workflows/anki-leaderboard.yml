name: Anki Leaderboard — live updates and daily history

on:
  schedule:
    # Every 5 minutes, including 03:50 and 03:55 Eastern.
    # GitHub Actions may start late; last SUCCESSFUL pre-04:00 result is archived.
    - cron: '*/5 * * * *'
      timezone: 'America/New_York'
  workflow_dispatch:

permissions:
  contents: read

# Avoid concurrent scrapers overwriting each other out of order.
concurrency:
  group: anki-leaderboard-collector
  cancel-in-progress: false

jobs:
  collect:
    name: Public Anki data to Supabase (no GitHub/Discord posting)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.2
      - name: Fetch opted-in users and save 5-minute current/daily statistics
        env:
          SUPABASE_URL: https://ssuqagroepoknexsweyr.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/anki_snapshot.py
